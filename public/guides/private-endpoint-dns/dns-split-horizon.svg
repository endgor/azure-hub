<text x="620" y="453" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#605e5c" text-anchor="middle">privatelink.blob...</text>
<rect x="790" y="410" width="210" height="60" fill="#fde7e9" stroke="#d13438"/>
<text x="895" y="435" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#323130" text-anchor="middle">mystorage.privatelink...</text>
<text x="895" y="456" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#d13438" text-anchor="middle">A  20.60.x.x (public)</text>
