<text x="340" y="379" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="20" y="340" width="1000" height="200" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="30" y="365" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="start">Anywhere else: internet, on-premises without forwarding, unlinked VNets</text>
<image href="data:image/svg+xml;base64," x="76" y="416" width="48" height="48"/>
<text x="100" y="482" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="middle">Client</text>
<text x="100" y="497" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#323130" text-anchor="middle">any network</text>
<rect x="270" y="412" width="140" height="56" rx="4" fill="#f3f2f1" stroke="#8a8886"/>
<text x="340" y="437" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="middle">Public resolver</text>
<text x="340" y="453" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#605e5c" text-anchor="middle">ISP, 8.8.8.8, ...</text>
<rect x="540" y="412" width="160" height="56" rx="4" fill="#f3f2f1" stroke="#8a8886"/>
