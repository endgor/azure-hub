<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d">
<title id="t">Private endpoint DNS: one name, two answers</title>
<desc id="d">Inside a VNet linked to the private DNS zone, Azure DNS follows the public CNAME to the privatelink name and answers from the private DNS zone with the private IP. Anywhere else, public DNS follows the same CNAME and returns the public IP.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#323130"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d13438"/></marker></defs>
<rect x="0.5" y="0.5" width="1039" height="559" fill="#ffffff" stroke="#e1dfdd"/>
<rect x="20" y="30" width="1000" height="210" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
<text x="30" y="55" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="start">Inside a VNet linked to the Private DNS zone</text>
<image href="data:image/svg+xml;base64," x="76" y="116" width="48" height="48"/>
<text x="100" y="182" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="middle">VM</text>
<text x="100" y="197" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#323130" text-anchor="middle">10.1.1.4</text>
<image href="data:image/svg+xml;base64," x="316" y="116" width="48" height="48"/>
<text x="340" y="182" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="middle">Azure DNS</text>
<text x="340" y="197" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#323130" text-anchor="middle">168.63.129.16</text>
<image href="data:image/svg+xml;base64," x="596" y="116" width="48" height="48"/>
<text x="620" y="182" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#323130" text-anchor="middle">Private DNS zone</text>
<text x="620" y="197" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#323130" text-anchor="middle">linked to the VNet</text>
<rect x="790" y="110" width="210" height="60" fill="#dff6dd" stroke="#107c10"/>
<text x="895" y="135" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#323130" text-anchor="middle">mystorage.privatelink...</text>
<text x="895" y="156" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#107c10" text-anchor="middle">A  10.0.1.5 (private)</text>
<path d="M124 140 L314 140" fill="none" stroke="#323130" stroke-width="1.5" marker-end="url(#ak)"/>
<circle cx="220" cy="140" r="10" fill="#0078d4"/>
<text x="220" y="144" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<path d="M366 140 L594 140" fill="none" stroke="#323130" stroke-width="1.5" marker-end="url(#ak)"/>
<circle cx="480" cy="140" r="10" fill="#0078d4"/>
<text x="480" y="144" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<path d="M646 140 L786 140" fill="none" stroke="#323130" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="180" y="262" width="680" height="56" fill="#ffffff" stroke="#8a8886"/>
<text x="196" y="284" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#323130" text-anchor="start">Public DNS (global)</text>
<text x="196" y="304" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#323130" text-anchor="start">mystorage.blob.core.windows.net  CNAME  mystorage.privatelink.blob.core.windows.net</text>
