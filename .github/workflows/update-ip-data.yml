name: Update Azure Data

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

# This workflow updates both Azure IP ranges and RBAC role definitions.
# Each fetch step may fail on its own: whatever succeeded is still committed and
# deployed, and the final step turns the run red so the failure is not missed.
# The Azure steps authenticate through @azure/identity using the AZURE_* env vars
# below, so no azure/login step is needed.
# Required GitHub secrets:
# - AZURE_CLIENT_ID
# - AZURE_CLIENT_SECRET
# - AZURE_TENANT_ID
# - AZURE_SUBSCRIPTION_ID
jobs:
  update-azure-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This is crucial for allowing the workflow to push changes
      actions: write   # Needed to dispatch the Cloudflare deploy workflow after pushing
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history so pushing works

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update Azure IP data
        id: ip
        continue-on-error: true
        run: npm run update-ip-data

      - name: Update Private DNS zone data
        id: dns
        continue-on-error: true
        run: npm run update-private-dns-zones

      - name: Update Azure VM pricing data
        id: vm-pricing
        continue-on-error: true
        run: npm run update-vm-pricing

      - name: Update Azure RBAC data
        id: rbac
        continue-on-error: true
        run: npm run update-rbac-data

      # Needs AZURE_SUBSCRIPTION_ID: VM specs come from Microsoft.Compute/skus at subscription scope.
      - name: Update Azure VM SKU specs
        id: vm-specs
        continue-on-error: true
        run: npm run update-vm-specs

      # Committed file; refresh here or it drifts behind public/data.
      - name: Regenerate site data
        run: npm run generate-site-data

      # Per-page lastmod for sitemap and IndexNow; must run after every data step above.
      - name: Track content changes
        run: npm run track-content-changes

      - name: Commit and push if changed
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git status
          git diff --staged --quiet && echo "changes=false" >> $GITHUB_OUTPUT || (git commit -m "chore: update Azure IP and RBAC data" && git push && echo "changes=true" >> $GITHUB_OUTPUT)

      - name: Trigger Cloudflare deploy
        if: steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare.yml --ref main

      - name: Submit URLs to IndexNow
        if: steps.commit.outputs.changes == 'true'
        run: npm run submit-indexnow -- --changed

      - name: Fail the run if any fetch step failed
        if: |
          steps.ip.outcome == 'failure' ||
          steps.dns.outcome == 'failure' ||
          steps.vm-pricing.outcome == 'failure' ||
          steps.rbac.outcome == 'failure' ||
          steps.vm-specs.outcome == 'failure'
        run: |
          echo "::error::One or more data fetch steps failed: ip=${{ steps.ip.outcome }} dns=${{ steps.dns.outcome }} vm-pricing=${{ steps.vm-pricing.outcome }} rbac=${{ steps.rbac.outcome }} vm-specs=${{ steps.vm-specs.outcome }}"
          exit 1
